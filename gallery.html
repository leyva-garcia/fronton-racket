<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Galería de paletas de frontón y pádel hechas a mano por Fronton Racket en Montevideo, Uruguay. Conocé nuestros diseños y el proceso de fabricación.">
    <link rel="canonical" href="https://fronton-racket.vercel.app/gallery.html">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://fronton-racket.vercel.app/gallery.html">
    <meta property="og:title" content="Galería | Fronton Racket">
    <meta property="og:description" content="Conocé nuestros diseños y el proceso de fabricación de paletas artesanales.">
    <meta property="og:image" content="https://fronton-racket.vercel.app/images/gallery-classic-1.jpeg">
    <meta property="og:locale" content="es_UY">

    <link rel="icon" type="image/jpeg" href="images/racket_logo.jpg">

    <title>Galería | Fronton Racket</title>

    <link rel="stylesheet" href="style.css">

    <!-- FONT AWESOME -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>


<body>


    <!-- HEADER -->

    <header>

        <div class="header-photo photo-left"></div>

        <div class="header-content">

            <div class="logo">

                <h1>FRONTON RACKET</h1>

                <p id="header-p">Paletas hechas a mano</p>

            </div>


            <nav>

                <a href="index.html">Inicio</a>

                <a href="index.html#rackets">Paletas</a>

                <a href="index.html#about">Acerca</a>

                <a href="index.html#contact">Contacto</a>

            </nav>

        </div>


        <div class="header-photo photo-right"></div>

    </header>



    <!-- GALLERY -->

    <main>

        <section class="gallery">

            <h2>Nuestra Galería</h2>

            <p class="gallery-intro">
                Conoce nuestras paletas, el proceso de fabricación
                y algunos momentos en la cancha.
            </p>


            <div class="gallery-grid">

                <img
                    src="images/gallery-classic-1.jpeg"
                    alt="Fronton Racket"
                >

                <img
                    src="images/gallery-classic-7.jpeg"
                    alt="Fronton Racket"
                >

                <img
                    src="images/gallery-classic-8.jpeg"
                    alt="Fronton Racket"
                >

                <img
                    src="images/gallery-classic-9.jpeg"
                    alt="Fronton Racket"
                >

                 <img
                    src="images/gallery-process-1.jpeg"
                    alt="Fronton Racket"
                >

                 <img
                    src="images/gallery-process-2.jpg"
                    alt="Fronton Racket"
                >

                 <img
                    src="images/gallery-process-3.jpg"
                    alt="Fronton Racket"
                >

                <img
                    src="images/gallery-classic-2.jpeg"
                    alt="Paleta de madera artesanal"
                >

                <img
                    src="images/gallery-classic-3.jpeg"
                    alt="Proceso de fabricación"
                >

                <img
                    src="images/gallery-classic-4.jpeg"
                    alt="Paleta Fronton Racket"
                >

                <img
                    src="images/gallery-classic-6.jpeg"
                    alt="Detalle de una paleta artesanal"
                >

                <img
                    src="images/gallery-court-1.jpeg"
                    alt="Paleta artesanal en la cancha"
                >

                <img
                    src="images/gallery-court-2.jpg"
                    alt="Paleta artesanal en la cancha"
                >

                <img
                    src="images/gallery-grip-1.jpeg"
                    alt="Fronton Racket grip"
                >

                <img
                    src="images/gallery-teen-1.jpeg"
                    alt="Fronton Racket en la cancha"
                >

                <img
                    src="images/gallery-court-3.jpeg"
                    alt="Detalle de una paleta artesanal"
                >

                <img
                    src="images/gallery-teen-2.jpeg"
                    alt="Fronton Racket en la cancha"
                >

                <img
                    src="images/gallery-teen-3.jpg"
                    alt="Fronton Racket en la cancha"
                >

            </div>


            <!-- BACK TO HOME -->

            <a href="index.html" class="gallery-back-button">

                <i class="fa-solid fa-arrow-left"></i>

                Volver al inicio

            </a>

    <!-- SOCIAL MEDIA LINKS -->

    <div class="social-links">

        <!-- Instagram -->

        <a
            href="https://www.instagram.com/frontonracket/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Instagram"
        >
            <i class="fa-brands fa-instagram"></i>
        </a>


        <!-- Facebook -->

        <a
            href="https://www.facebook.com/frontonracket"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Facebook"
        >
            <i class="fa-brands fa-facebook"></i>
        </a>


        <!-- YouTube -->

        <a
            href="http://www.youtube.com/@FrontonRacket"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="YouTube"
        >
            <i class="fa-brands fa-youtube"></i>
        </a>

    </div>



    <!-- FLOATING WHATSAPP -->

    <a
        href="https://wa.me/598099401543"
        class="floating-whatsapp"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Contact Fronton Racket on WhatsApp"
    >

        <div class="whatsapp-racket">

            <img
                src="images/racket_logo.jpg"
                alt="Fronton Racket"
            >

            <span class="whatsapp-icon">

                <i class="fa-brands fa-whatsapp"></i>

            </span>

        </div>


        <span class="whatsapp-message">
            Contáctanos
        </span>

    </a>



    <!-- FOOTER -->

    <footer>

        <p>
            © <span id="year"></span> Fronton Racket
        </p>

        <p>
            Hechas a mano en Montevideo, Uruguay

    <script src="script.js"></script>
